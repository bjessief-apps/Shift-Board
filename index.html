<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Shift Board</title>
<style>
:root{
  --bg:#0d0f12; --panel:#14171c; --panel2:#1b1f26; --line:#262b34; --text:#e6e8ec; --muted:#8b93a1;
  --accent:#f0a83a; --on-accent:#141414; --good:#43b883; --bad:#e5645f;
  --s1:#4f9cf7; --s2:#a07cf0; --s3:#f0a83a;
  --r:3px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f3f4f6; --panel:#ffffff; --panel2:#f1f2f4; --line:#dfe2e7; --text:#15181d; --muted:#5c6573; --accent:#c87a0c; --on-accent:#fff; --good:#1e9461; --bad:#c93d3d; --s1:#2d78d6; --s2:#7550cf; --s3:#c87a0c;}
}
:root[data-theme="light"]{--bg:#f3f4f6; --panel:#ffffff; --panel2:#f1f2f4; --line:#dfe2e7; --text:#15181d; --muted:#5c6573; --accent:#c87a0c; --on-accent:#fff; --good:#1e9461; --bad:#c93d3d; --s1:#2d78d6; --s2:#7550cf; --s3:#c87a0c;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;max-width:1100px;margin:0 auto}
.top h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;font-weight:700}
.top h1 b{color:var(--accent);font-weight:700}
.top .sp{flex:1}
nav{display:flex;gap:0;padding:0 8px;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px 9px;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.02em}
nav button.on{background:none;color:var(--text);border-color:transparent;border-bottom-color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.ghost{background:transparent}
button.sm{padding:4px 9px;font-size:12px}
#range{width:auto;max-width:44vw;min-width:0;padding:5px 8px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:14px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.panel>h2{font-size:11px;margin:0;padding:10px 14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.panel>h2 small{text-transform:none;letter-spacing:0;font-weight:400}
.pb{padding:12px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;background:var(--panel2)}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.scroll{overflow-x:auto}
.tag{display:inline-block;border-radius:2px;padding:0 6px;font-size:11px;font-weight:700;line-height:18px;color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.intro p{margin:0 0 8px}
.intro p:last-child{margin-bottom:0}
.shcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:4px 12px 12px;margin-top:10px}
.shcard .hd{display:flex;gap:8px;align-items:flex-end}
.shcard .hd>div{flex:1}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{min-width:0;padding:7px 0;font-size:12px;font-weight:600;background:var(--panel)}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tot{font-size:12px;color:var(--muted);margin-top:8px}
.perday{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.dayrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;margin-top:6px}
.dayrow b{font-size:12px}
.dayrow input{padding:6px 8px}
.dtt{grid-column:2 / 4;font-size:11px;color:var(--muted);margin-top:-2px}
.tot b{color:var(--text)}
.crew{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r)}
.crew li{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line)}
.crew li:last-child{border-bottom:0}
.crew li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.crew li select{width:auto;max-width:46%;padding:4px 6px;font-size:12px}
.x{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
.x:hover{color:var(--bad);border-color:transparent}
.dirty{font-size:12px;color:var(--accent)}
.confirm{border:1px solid var(--bad);border-radius:var(--r);padding:12px;margin-top:12px}
.confirm p{margin:0 0 8px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;margin:8px 0 10px}
.check input{width:auto}
.rank{display:inline-block;min-width:22px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.rank.g{color:var(--accent)}
.detail{background:var(--panel2);border-left:2px solid var(--accent);padding:10px 12px;margin:4px 0 8px;white-space:normal}
.rep{border-left:2px solid var(--line);padding:2px 10px;margin:8px 0}
.rep pre{white-space:pre-wrap;margin:4px 0 0;font:12px/1.4 ui-monospace,Consolas,monospace}
label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:130px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{border-radius:2px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.bar-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px}
.bar-legend i{display:inline-block;width:8px;height:8px;margin-right:5px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.empty{padding:22px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-size:10px}
@media (max-width:480px){ th,td{padding:7px 8px} .top{padding:10px 12px 6px} main{padding:12px} }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Shift <b>Board</b></h1>
    <div class="sp"></div>
    <select id="range" aria-label="Week"></select>
    <button class="ghost sm" id="themeBtn" title="Light / dark" aria-label="Light or dark">◐</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="toast"></div>

<script>
"use strict";
/* Shift Board — a private shift logger. Everything is stored in this browser only.
   Your own setup and history come from a backup file you load on your device;
   none of it lives in this page. */
const KEY = "shiftboard.v1";
const DKEY = "shiftboard.draft";
const DEFAULT_SETTINGS = { title:"", workerWord:"Workers", supportLabel:"Support", shifts:[], crew:[], source:"" };
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const PALETTE = ["#3d7fd9","#8a63d8","#c27a12","#2e9466","#cf4f6f","#1f97a3","#8f7d22"];

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let DB = Object.assign({settings:{}, base:[], shifts:{}, deleted:[], containers:[], theme:null}, load());
function save(){ _SA = null; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast("Couldn't save on this device"); } }

/* Shift schedules. Older backups stored 1st/2nd/3rd shift hours; those become named shifts. */
function normShifts(st){
  let list = Array.isArray(st.shifts) ? st.shifts : null;
  if (!list){ const h = st.hours || {}; list = Object.keys(h).map(id=>({id, name:id+" shift", hours:+h[id]||null})); }
  return list.filter(x=>x && x.id).map(x=>{
    const dt = {}; for (const [k,v] of Object.entries(x.dayTimes||{})) if (v && (v.start||v.end)) dt[k] = {start:v.start||"", end:v.end||""};
    return {id:String(x.id), name:String(x.name||x.id), days:Array.isArray(x.days)?x.days.map(Number):[], start:x.start||"", end:x.end||"", perDay:!!x.perDay, dayTimes:dt, hours:x.hours!=null&&+x.hours>0?+x.hours:null};
  });
}
function normCrew(c){
  const seen = new Set();
  return (c||[]).map(x=> typeof x==="string" ? {name:x.trim(), shift:""} : {name:String((x&&x.name)||"").trim(), shift:(x&&x.shift)||""})
    .filter(x=>{ const k=x.name.toLowerCase(); if(!x.name||seen.has(k)) return false; seen.add(k); return true; });
}
const S = () => { const raw = DB.settings||{}; const st = Object.assign({}, DEFAULT_SETTINGS, raw); st.shifts = normShifts(raw); st.crew = normCrew(raw.crew); st.title = (st.title||"").trim() || "Shift Board"; return st; };
const isBlank = () => !Object.keys(DB.settings||{}).length && !(DB.base||[]).length && !Object.keys(DB.shifts||{}).length && !(DB.containers||[]).length;

/* Unsaved input, kept across refreshes until it's saved or cleared. */
let DRAFT = (()=>{ try{ return JSON.parse(localStorage.getItem(DKEY)) || {}; }catch(e){ return {}; } })();
DRAFT.f = DRAFT.f || {}; DRAFT.scroll = DRAFT.scroll || {};
function saveDraft(){ try{ localStorage.setItem(DKEY, JSON.stringify(DRAFT)); }catch(e){ /* ignore */ } }

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n,d=1) => n==null||!isFinite(n) ? "–" : (Math.round(n*10**d)/10**d).toLocaleString();
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const weekStart = s => { const d=pd(s); d.setDate(d.getDate()-d.getDay()); return iso(d); };
const dayLbl = s => pd(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const wkLbl = s => { const a=pd(s), b=pd(s); b.setDate(b.getDate()+6); return a.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+b.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
/* every shift: the ones in Setup first, then any shift name found in logged data that isn't in Setup */
let _SA = null;
function shiftsAll(){
  if (_SA) return _SA;
  const list = S().shifts.slice(), ids = new Set(list.map(x=>x.id));
  const add = id => { if(id && !ids.has(id)){ ids.add(id); list.push({id, name:id, days:[], start:"", end:"", hours:null, orphan:true}); } };
  for (const s of allShifts()) add(s.shift);
  for (const c of DB.containers) add(c.shift);
  return (_SA = list);
}
const shiftInfo = id => { const all=shiftsAll(), i=all.findIndex(x=>x.id===id); return i<0 ? {id, name:id||"–", hours:null, color:PALETTE[0], i:99} : Object.assign({}, all[i], {color:PALETTE[i%PALETTE.length], i}); };
const shiftName = id => shiftInfo(id).name;
/* a shift's times on a given weekday: that day's custom hours if set, otherwise the usual hours */
function dayTimes(x, wd){ const o = x && x.perDay && wd!=null && x.dayTimes ? x.dayTimes[wd] : null; return {start:(o&&o.start)||x.start||"", end:(o&&o.end)||x.end||""}; }
function shiftHours(x, wd){ if(!x) return null; const t=dayTimes(x, wd); if(t.start && t.end){ const h=durH(t.start,t.end); return h>0?h:null; } return x.hours||null; }
/* what to show next to a shift name: its usual hours, or "varies" when days differ */
function hoursLabel(x){ const days=x.days&&x.days.length?x.days:[null], hs=[...new Set(days.map(d=>shiftHours(x,d)).filter(Boolean))]; return !hs.length ? "" : hs.length>1 ? "varies" : fmt(hs[0])+"h"; }
const tag = id => { const x=shiftInfo(id); return `<span class="tag" style="background:${x.color}">${esc(x.name)}</span>`; };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2200); }
const uid = () => Math.random().toString(36).slice(2,9);
const mins = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
function durH(a,b){ const x=mins(a), y=mins(b); if(x==null||y==null) return null; let d=y-x; if(d<0) d+=1440; return d/60; }

/* ---------------- data model ---------------- */
function allShifts(){
  const map = {};
  for (const s of DB.base||[]) map[s.id] = JSON.parse(JSON.stringify(s));
  for (const [id,s] of Object.entries(DB.shifts)) map[id] = Object.assign(map[id]||{}, s, {edited:true});
  for (const id of DB.deleted) delete map[id];
  const order = S().shifts.map(x=>x.id), o = id => { const i=order.indexOf(id); return i<0 ? 99 : i; };
  return Object.values(map).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(o(a.shift)-o(b.shift)) || (a.shift<b.shift?-1:1));
}
function metrics(s){
  const e=s.eod||{}, st=s.start||{};
  const workers = e.lumpers ?? st.lumpers ?? null;
  const other = e.lumpersOther ?? st.lumpersOther ?? 0;
  const labor = workers==null ? null : workers + (other||0);
  const completed = e.completed ?? null;
  const hours = shiftHours(shiftInfo(s.shift), pd(s.date).getDay());
  const cons = DB.containers.filter(c=>c.date===s.date && c.shift===s.shift);
  const pieces = cons.reduce((a,c)=>a+(+c.pieces||0),0);
  return {
    workers, other, labor, completed, carried: e.carried ?? null,
    support: e.osEpj ?? st.osEpj ?? null,
    perWorker: labor && completed!=null ? completed/labor : null,
    lhpc: labor && completed && hours ? labor*hours/completed : null, hours,
    pieces: pieces||null, ranked: labor!=null && completed!=null
  };
}
const inRange = d => { const r=$("#range").value; return r==="all" || weekStart(d)===r; };

/* ---------------- report paste parser ---------------- */
function parseReport(text){
  const first = (text.split(/\r?\n/).find(l=>l.trim())||"").toLowerCase();
  const norm = x => String(x).toLowerCase().replace(/\bfirst\b/g,"1st").replace(/\bsecond\b/g,"2nd").replace(/\bthird\b/g,"3rd").replace(/\s+/g," ").trim();
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const fl = norm(first); let shift = null, best = 0;
  for (const sh of S().shifts){
    const n = norm(sh.name), core = n.replace(/ shift$/,"");
    for (const cand of [n, core+" shift", core]) if (cand && cand.length>best && new RegExp("(^|\\W)"+reEsc(cand)+"(\\W|$)").test(fl)){ shift = sh.id; best = cand.length; }
  }
  const kind = /eod|end of day|end of shift/i.test(text) ? "eod" : "start";
  const f = {}; const seen = new Set(); const add=(k,n)=>{ f[k]=(f[k]||0)+n; };
  const W = "(?:lumpers?|workers?|unloaders?|crew|people)";
  const SUP = "(?:os[- ]?epj|support|"+(S().supportLabel||"support").replace(/[^a-z0-9 ]/gi,"").trim().replace(/\s+/g,"[- ]?")+")";
  for (let raw of text.split(/\r?\n|,/)){
    let l = raw.replace(/[⁠‎]/g,"").trim().replace(/^[-•·\s]+/,"").trim();
    const hm = l.match(/^.*?\b(eod|start|report)\b\s*[-–:]\s*(\d.*)$/i); if (hm) l = hm[2];
    const low = l.toLowerCase(); let m;
    if (!l || /^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(l)) continue;
    if ((m=l.match(new RegExp("^(\\d+)\\s*[-–]?\\s*"+W+"\\b(.*)$","i"))) || (m=l.match(new RegExp("^"+W+"\\s+(\\d+)()$","i")))){
      const n=+m[1], rest=m[2].toLowerCase();
      if (/sent home|home early/.test(rest)) add("sentHome",n);
      else if (/(1st|2nd|3rd) shift|from/.test(rest) && (seen.has("w") || /from|3rd shift/.test(rest))) add("lumpersOther",n);
      else if (!seen.has("w")){ f.lumpers=n; seen.add("w"); }
      continue;
    }
    if ((m=l.match(/^(\d+)\s*[-–]?\s*(new |fresh |completed )?(?:containers?|trailers?|loads?)\b(.*)$/i))){
      const n=+m[1], pre=(m[2]||"").toLowerCase(), rest=m[3].toLowerCase();
      if (/yard/.test(rest)) f.yardContainers=n;
      else if (/finish/.test(rest) && /2nd|second|next/.test(rest)) add("carried",n);
      else if (/done|complete|finished/.test(rest) || pre==="completed ") add("completed",n);
      else add("containers",n);
      continue;
    }
    if ((m=l.match(/^(?:containers?|trailers?|loads?)\s+(plugged|completed|done|finish 2nd shift)?\s*(\d+)\s*(completed|done)?$/i))){
      const k=((m[1]||"")+(m[3]||"")).toLowerCase(), n=+m[2];
      if (/finish/.test(k)) add("carried",n); else if (/complet|done/.test(k)) add("completed",n); else add("containers",n);
      continue;
    }
    if ((m=l.match(/^(\d+)\s*(?:with \S+ )?(?:containers? )?finish/i)) && /2nd|second|next/.test(low)){ add("carried",+m[1]); continue; }
    if ((m=l.match(/^(\d+)\s*[-–]?\s*(rollovers?|passovers?|partials?|carryovers?)\b/i))){ add("carried",+m[1]); continue; }
    if (/^(no|0)[ -](rollovers?|passovers?)/.test(low)){ add("carried",0); continue; }
    if ((m=l.match(new RegExp("^(\\d+)\\s*[-–]?\\s*"+SUP+"\\b(.*)$","i"))) || (m=l.match(new RegExp("^"+SUP+"\\s*[-–]?\\s*(\\d+)()\\s*$","i")))){
      if (!/train|call|no show|n\/c|ns\/nc|late|absent|interview|came|arrived|start|from|certified|sick|schedule/i.test(m[2]) && !seen.has("s")){ f.osEpj=+m[1]; seen.add("s"); }
      continue;
    }
    if ((m=low.match(/yard count\s+(\d+)/)) || (m=low.match(/^(\d+)\s+(imports )?yard count/))){ f.yard=+m[1]; continue; }
    if ((m=low.match(/^(\d+)\s*[-–]?\s*shipping/))){ f.shipping=+m[1]; continue; }
  }
  if (kind==="eod" && f.completed==null && f.containers!=null){ f.completed=f.containers; delete f.containers; }
  return {shift, kind, fields:f};
}

/* ---------------- views ---------------- */
let TAB = "dash", SORT = {k:"lhpc", dir:1}, OPEN = null, SHIFTF = "all", PICK = new Set(DRAFT.pick||[]), CLEARING = false;
const TABS = [["dash","Overview"],["shifts","Shifts"],["workers","People"],["log","Log"],["data","Setup"]];
function lbl(){ const s=S(); return {lumpers:s.workerWord.toLowerCase(),lumpersOther:"from other shift",containers:"containers",completed:"completed",carried:"left over",osEpj:s.supportLabel,yard:"yard count",shipping:"shipping",sentHome:"sent home",yardContainers:"in yard"}; }
const fields2txt = f => { const L=lbl(); return Object.entries(f||{}).map(([k,v])=>`${v} ${L[k]||k}`).join(" · "); };

function renderHead(){
  const t=S().title.trim(); const sp=t.lastIndexOf(" ");
  $("#title").innerHTML = sp>0 ? esc(t.slice(0,sp))+" <b>"+esc(t.slice(sp+1))+"</b>" : "<b>"+esc(t)+"</b>";
  document.title = t;
  $("#nav").innerHTML = TABS.map(([k,l])=>`<button class="${k===TAB?"on":""}" data-tab="${k}">${l}</button>`).join("");
}
function renderRange(){

function weekChart(){

  const max = Math.max(1,...data.map(d=>d.tot));
  const Wd=Math.max(300,weeks.length*64), H=170, bw=30, gap=(Wd-20)/Math.max(1,weeks.length);

    shs.forEach((sh,j)=>{ const h=d[sh.id]/max*(H-44); if(h>0){ y-=h; g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${PALETTE[j%PALETTE.length]}"><title>${esc(sh.name)}: ${d[sh.id]}</title></rect>`; } });

  });

function workerStats(){
  const P = {};
  for (const c of DB.containers.filter(c=>inRange(c.date))){
    const crew=(c.crew||[]).filter(Boolean); if(!crew.length) continue;
    const share=1/crew.length, h=durH(c.start,c.end), pcs=+c.pieces||0;
    for (const n of crew){
      const p = P[n] ||= {name:n, doors:0, credit:0, pieces:0, hours:0, shifts:new Set()};
      p.doors++; p.credit += c.status==="rolled" ? share*0.5 : share; p.pieces += pcs*share; p.shifts.add(c.date+c.shift);
      if (h!=null) p.hours += h;
    }
  }
  return Object.values(P).map(p=>({...p, shifts:p.shifts.size, pph: p.hours&&p.pieces? p.pieces/p.hours : null, hpc: p.credit&&p.hours? p.hours/p.credit : null}));
}

function shiftGuess(){
  /* the shift happening now, or the one that ended most recently (within 12 hours), from the schedules in Setup */
  const now=new Date(), list=S().shifts; let best=null;
  for (const back of [0,1]){
    const d=new Date(now.getFullYear(), now.getMonth(), now.getDate()-back);
    for (const sh of list){
      const tm = dayTimes(sh, d.getDay());
      if (!tm.start || !tm.end || (sh.days.length && !sh.days.includes(d.getDay()))) continue;
      const st=new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, mins(tm.start)), en=new Date(st.getTime()+(durH(tm.start,tm.end)||0)*3600000);
      if (st<=now && now<en) return {date:iso(d), shift:sh.id};
      if (en<=now && now-en<12*3600000 && (!best || now-en<best.gap)) best={gap:now-en, date:iso(d), shift:sh.id};
    }
  }
  if (best) return best;
  const today=list.find(sh=>sh.days.includes(now.getDay())) || list[0];
  return {date:iso(now), shift:today?today.id:""};
}

  const box = part => F.map(k=>`<div><label>${esc(L[k])}</label><input data-ef="${part}.${k}" inputmode="numeric" value="${s[part]?.[k]??""}"></div>`).join("");
  $("#main").innerHTML = `<div class="panel"><h2>Edit ${dayLbl(s.date)} · ${esc(shiftName(s.shift))}</h2><div class="pb">
    <b>Start</b><div class="grid2">${box("start")}</div><br><b>EOD</b><div class="grid2">${box("eod")}</div>
    <label>Note</label><textarea id="eNote" style="min-height:70px">${esc(s.notes||"")}</textarea>
    <div class="row" style="margin-top:12px"><button class="pri" data-esave="${id}">Save</button><button class="sm ghost" data-cancel>Cancel</button><span style="flex:1"></span><button class="sm" data-del="${id}">Delete shift</button></div></div></div>`;
}
function saveEdit(id){
  const s = JSON.parse(JSON.stringify(allShifts().find(x=>x.id===id)));
  document.querySelectorAll("[data-ef]").forEach(i=>{ const [p,k]=i.dataset.ef.split("."); const v=i.value.trim(); s[p]=s[p]||{}; if(v==="") delete s[p][k]; else s[p][k]=+v.replace(/\D/g,""); });
  s.notes=$("#eNote").value; delete s.edited; DB.shifts[id]=s; save(); toast("Saved"); render();
}

/* ---------- setup & backup ---------- */
function snapshot(){ const s=S(), raw=DB.settings||{}; return {title:raw.title||"", workerWord:s.workerWord, supportLabel:s.supportLabel, shifts:JSON.parse(JSON.stringify(s.shifts)), crew:s.crew.map(c=>Object.assign({},c))}; }
function setupDraft(){ if(!DRAFT.setup) DRAFT.setup = snapshot(); return DRAFT.setup; }
const setupDirty = () => !!DRAFT.setup && JSON.stringify(DRAFT.setup)!==JSON.stringify(snapshot());
function shiftTotal(x){
  const n = x.days.length, dd = n ? `${n} day${n>1?"s":""} a week` : "";
  if (x.perDay && n){
    const hs = x.days.map(d=>shiftHours(x,d)), known = hs.filter(Boolean), week = known.reduce((a,h)=>a+h,0);
    const same = new Set(known).size===1 && known.length===n;
    if (!known.length) return `${dd} · add times to see the hours`;
    return `${same?`<b>${fmt(known[0],2)} hrs</b> per shift`:"Hours vary by day"} · ${dd} · <b>${fmt(week,2)} hrs</b> a week${known.length<n?` <span class="muted">(${n-known.length} day${n-known.length>1?"s":""} without times)</span>`:""}`;
  }
  const h = x.start && x.end ? durH(x.start,x.end) : null;
  if (h) return `<b>${fmt(h,2)} hrs</b> per shift${n?` · ${dd} · <b>${fmt(h*n,2)} hrs</b> a week`:""}`;
  if (x.hours) return `Counting <b>${fmt(x.hours,2)} hrs</b> per shift until you add start and end times`;
  return n ? `${dd} · add start and end times to see the hours` : "Days and times are optional";
}
function dayTotal(x,d){
  const o = (x.dayTimes||{})[d], h = shiftHours(x,d), t = dayTimes(x,d);
  const clk = v => { if(!v) return "?"; const [H,M]=v.split(":").map(Number); return (H%12||12)+(M?":"+String(M).padStart(2,"0"):"")+(H<12?"a":"p"); };
  return (o && (o.start||o.end) ? "" : "Same as usual · ") + (t.start||t.end ? clk(t.start)+"–"+clk(t.end)+" · " : "") + (h ? fmt(h,2)+" hrs" : "no times yet");
}
function refreshTotals(i){
  const x = (DRAFT.setup||snapshot()).shifts[i]; if(!x) return;
  const el=$("#shtot"+i); if(el) el.innerHTML=shiftTotal(x);
  for (const d of x.days){ const t=$(`#dtt${i}-${d}`); if(t) t.textContent=dayTotal(x,d); }
}
function shiftCard(x,i){
  const dt = x.dayTimes||{};
  const perDay = !x.perDay ? "" : x.days.length ? `<div class="perday">${x.days.map(d=>`<div class="dayrow">
      <b>${DAYS[d]}</b>
      <input type="time" data-sh="${i}" data-k="dt:${d}:start" value="${esc((dt[d]||{}).start||"")}" aria-label="${DAYS[d]} start">
      <input type="time" data-sh="${i}" data-k="dt:${d}:end" value="${esc((dt[d]||{}).end||"")}" aria-label="${DAYS[d]} end">
      <span class="dtt" id="dtt${i}-${d}">${dayTotal(x,d)}</span></div>`).join("")}
      <p class="note" style="margin-top:6px">Leave a day blank to use the usual hours.</p></div>`
    : `<p class="note">Pick the shift's days above, then set custom hours for any of them.</p>`;
  return `<div class="shcard">
    <div class="hd"><div><label for="shn${i}">What shift is this?</label><input id="shn${i}" data-sh="${i}" data-k="name" value="${esc(x.name)}" placeholder="e.g. 1st shift, Night shift" autocomplete="off"></div>
      <button class="x" data-shrm="${i}" aria-label="Remove this shift" style="margin-bottom:4px">✕</button></div>
    <label>Days</label><div class="days">${DAYS.map((d,j)=>`<button data-day="${i}:${j}" class="${x.days.includes(j)?"on":""}" aria-pressed="${x.days.includes(j)}">${d}</button>`).join("")}</div>
    <div class="grid2"><div><label for="shs${i}">${x.perDay?"Usual start":"Starts"}</label><input type="time" id="shs${i}" data-sh="${i}" data-k="start" value="${esc(x.start)}"></div>
      <div><label for="she${i}">${x.perDay?"Usual end":"Ends"}</label><input type="time" id="she${i}" data-sh="${i}" data-k="end" value="${esc(x.end)}"></div></div>
    <label class="check" style="margin-top:10px"><input type="checkbox" data-perday="${i}" ${x.perDay?"checked":""}> Custom hours for certain days</label>
    ${perDay}
    <div class="tot" id="shtot${i}">${shiftTotal(x)}</div></div>`;
}
function viewData(){
  const s=S(), d=DRAFT.setup||snapshot(), first=isBlank(), dirty=setupDirty();
  const named = d.shifts.filter(x=>x.name.trim());
  const crewOpts = sel => `<option value="">Any shift</option>`+named.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?"selected":""}>${esc(x.name)}</option>`).join("");
  const clearBox = CLEARING ? `<div class="confirm"><p><b>Clear all shift data?</b> This deletes every logged shift, report and door on this device. It can't be undone.</p>
      <p class="muted">Save a backup first so you can bring it all back if you need to.</p>
      <label class="check"><input type="checkbox" id="clrSetup"> Also clear my setup (name, shifts and crew)</label>
      <div class="row"><button class="pri" id="clrBackup">Save a backup first</button><button class="danger" id="clrGo">Clear all shift data</button><button class="sm ghost" id="clrCancel">Cancel</button></div></div>`
    : `<div class="row" style="margin-top:12px"><button class="sm ghost" id="bReset">Clear all shift data…</button></div>`;
  return `${first?`<div class="panel"><h2>Welcome</h2><div class="pb intro">
      <p><b>Let's set up your board.</b> Add your warehouse or agency, the shifts you run, and your crew. You can change any of this later.</p>
      <p class="muted">Everything stays in this browser on this device. Nothing is uploaded. Moving over from another phone? Load your backup at the bottom of this page.</p></div></div>`:""}
  <div class="panel"><h2>Setup</h2><div class="pb"><div class="grid2">
      <div><label for="sTitle">Name of warehouse/agency</label><input id="sTitle" data-sf="title" value="${esc(d.title)}" placeholder="e.g. Westside DC" autocomplete="off"></div>
      <div><label for="sWorker">Worker title</label><input id="sWorker" data-sf="workerWord" value="${esc(d.workerWord)}" placeholder="e.g. Lumpers" autocomplete="off"></div>
      <div><label for="sSupport">Support team label</label><input id="sSupport" data-sf="supportLabel" value="${esc(d.supportLabel)}" autocomplete="off"></div>
  </div></div></div>
  <div class="panel"><h2>Shift schedules ${d.shifts.length?`<small>${d.shifts.length} added</small>`:""}</h2><div class="pb">
    ${d.shifts.length?"":`<p class="muted" style="margin:0">Add each shift you run. Only the name is required.</p>`}
    ${d.shifts.map(shiftCard).join("")}
    <div class="row" style="margin-top:12px"><button id="shAdd">+ Add shift schedule</button></div>
  </div></div>
  <div class="panel"><h2>Crew ${d.crew.length?`<small>${d.crew.length} ${d.crew.length===1?"person":"people"}</small>`:""}</h2><div class="pb">
    <div class="row"><input id="crewNew" placeholder="Type a name, then Add" style="flex:1;min-width:140px" autocomplete="off" enterkeyhint="done" value="${esc(DRAFT.crewNew||"")}"><button id="crewAdd">Add</button></div>
    ${d.crew.length?`<ul class="crew">${d.crew.map((c,i)=>`<li><span>${esc(c.name)}</span>${named.length?`<select data-crewsh="${i}" aria-label="Shift for ${esc(c.name)}">${crewOpts(c.shift)}</select>`:""}<button class="x" data-crewrm="${i}" aria-label="Remove ${esc(c.name)}">✕</button></li>`).join("")}</ul>`
      :`<p class="note">Each name you add lands in this list. You can put someone on a shift or leave them on any shift.</p>`}
  </div></div>
  <div class="panel"><div class="pb row" style="justify-content:space-between">
    <span class="${dirty?"dirty":"muted"}" style="font-size:12px">${dirty?"Unsaved changes":first?"":"All changes saved"}</span>
    <span class="row">${dirty&&!first?`<button class="sm ghost" id="sDiscard">Discard</button>`:""}<button class="pri" id="sSave">${first?"Save and start":"Save setup"}</button></span></div></div>
  <div class="panel"><h2>Backup</h2><div class="pb">
    <p>Everything is stored <b>only in this browser on this device</b>. Save a backup now and then, and use it to move your setup and history to another device.</p>
    <div class="row"><button class="pri" id="bExport">Save backup</button><label class="chip" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">Load backup<input type="file" id="bImport" accept=".json,application/json" style="display:none"></label><button class="sm" id="bCopy">Copy week summary</button></div>
    <p class="note">On this device: ${allShifts().length} shift${allShifts().length===1?"":"s"} · ${DB.containers.length} door${DB.containers.length===1?"":"s"}.</p>
    ${clearBox}
  </div></div>`;
}
function saveSetup(){
  const d = DRAFT.setup || snapshot();
  const shifts = d.shifts.filter(x=>x.name.trim() || x.days.length || x.start || x.end);
  if (shifts.some(x=>!x.name.trim())){ toast("Give every shift a name"); return; }
  const names = shifts.map(x=>x.name.trim().toLowerCase());
  if (new Set(names).size!==names.length){ toast("Two shifts have the same name"); return; }
  const first = isBlank(), ids = new Set(shifts.map(x=>x.id));
  const st = Object.assign({}, DB.settings, {title:d.title.trim(), workerWord:d.workerWord.trim()||"Workers", supportLabel:d.supportLabel.trim()||"Support",
    shifts: shifts.map(x=>{
      const days=x.days.slice().sort((a,b)=>a-b), dt={};
      if (x.perDay) for (const d of days){ const o=(x.dayTimes||{})[d]; if(o && (o.start||o.end)) dt[d]={start:o.start||"", end:o.end||""}; }
      const anyTimes = (x.start&&x.end) || Object.keys(dt).length;
      return {id:x.id, name:x.name.trim(), days, start:x.start, end:x.end, perDay:!!x.perDay, dayTimes:dt, hours:anyTimes?null:x.hours};
    }),
    crew: d.crew.map(c=>({name:c.name, shift:ids.has(c.shift)?c.shift:""}))});
  delete st.hours;
  DB.settings = st; save(); delete DRAFT.setup; saveDraft(); renderRange();
  if (first){ toast("Setup saved. Log your first shift."); go("log"); } else { toast("Setup saved"); render(); }
}
function crewAdd(){
  const inp=$("#crewNew"), n=inp.value.trim().replace(/\s+/g," "); if(!n){ inp.focus(); return; }
  const d=setupDraft();
  if (d.crew.some(c=>c.name.toLowerCase()===n.toLowerCase())){ toast(n+" is already on the list"); inp.select(); return; }
  d.crew.push({name:n, shift:""}); DRAFT.crewNew=""; saveDraft(); render(); $("#crewNew").focus();
}
function clearAll(){
  const keep = !$("#clrSetup").checked;
  DB = {settings: keep?DB.settings:{}, base:[], shifts:{}, deleted:[], containers:[], theme:DB.theme};
  DRAFT = {f:{}, scroll:{}}; PICK = new Set(); CLEARING = false; OPEN = null;
  save(); saveDraft(); renderRange(); toast(keep?"Shift data cleared":"Everything cleared"); TAB="data"; render(); window.scrollTo(0,0);
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:"shiftboard",v:1,saved:new Date().toISOString(),settings:DB.settings,base:DB.base,shifts:DB.shifts,deleted:DB.deleted,containers:DB.containers},null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="shift-board-backup-"+iso(new Date())+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast("Backup saved");
}
function importData(file){
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=="shiftboard") throw 0;
    if (d.settings) DB.settings=Object.assign({}, DB.settings, d.settings);
    if (Array.isArray(d.base)) { const m={}; for(const s of (DB.base||[]).concat(d.base)) m[s.id]=s; DB.base=Object.values(m); }
    DB.shifts=Object.assign(DB.shifts, d.shifts||{}); DB.deleted=[...new Set(DB.deleted.concat(d.deleted||[]))];
    const have=new Set(DB.containers.map(c=>c.id)); DB.containers=DB.containers.concat((d.containers||[]).filter(c=>!have.has(c.id)));
    delete DRAFT.setup; saveDraft(); save(); renderRange(); toast("Loaded"); if(TAB==="data" && allShifts().length) go("dash"); else render();
  }catch(e){ toast("That file isn't a Shift Board backup"); } }; r.readAsText(file);
}
function weekSummary(){
  const w = $("#range").value==="all" ? weekStart(iso(new Date())) : $("#range").value, t=byType(allShifts().filter(s=>weekStart(s.date)===w)), W=S().workerWord.toLowerCase();
  let out=`${S().title} — week of ${wkLbl(w)}\n`;
  for (const v of Object.values(t)) if(v.n) out+=`${v.info.name}: ${v.n} shifts, ${v.comp} containers, ${fmt(v.perWorker,2)} per ${W.replace(/s$/,"")}, ${fmt(v.lhpc)} labor hrs/container\n`;
  return out;
}

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("button,[data-open],[data-sort],[data-chip]"); if(!t) return;
  if (t.dataset.tab){ go(t.dataset.tab); return; }
  if (t.dataset.sort){ const k=t.dataset.sort; SORT = SORT.k===k?{k,dir:-SORT.dir}:{k,dir:(k==="lhpc"||k==="rank"||k==="hpc")?1:-1}; render(); return; }
  if (t.dataset.shiftf){ SHIFTF=t.dataset.shiftf; render(); return; }
  if (t.dataset.open){ OPEN = OPEN===t.dataset.open?null:t.dataset.open; render(); return; }
  if (t.hasAttribute("data-close")){ OPEN=null; render(); return; }
  if (t.dataset.edit){ editShift(t.dataset.edit); return; }
  if (t.dataset.esave){ saveEdit(t.dataset.esave); return; }
  if (t.hasAttribute("data-cancel")){ render(); return; }
  if (t.dataset.del){ if(confirm("Delete this shift?")){ DB.deleted.push(t.dataset.del); delete DB.shifts[t.dataset.del]; save(); OPEN=null; renderRange(); render(); } return; }
  if (t.dataset.delc){ DB.containers=DB.containers.filter(c=>c.id!==t.dataset.delc); save(); render(); return; }
  if (t.dataset.chip!=null){ const n=t.dataset.chip; PICK.has(n)?PICK.delete(n):PICK.add(n); t.classList.toggle("on"); DRAFT.pick=[...PICK]; saveDraft(); return; }
  /* setup editor */
  if (t.dataset.day){ const [i,j]=t.dataset.day.split(":").map(Number), x=setupDraft().shifts[i]; x.days = x.days.includes(j) ? x.days.filter(v=>v!==j) : x.days.concat(j).sort((a,b)=>a-b); saveDraft(); render(); return; }
  if (t.dataset.shrm){ const d=setupDraft(), x=d.shifts[+t.dataset.shrm];
    const used = allShifts().some(s=>s.shift===x.id) || DB.containers.some(c=>c.shift===x.id);
    if (used && !confirm(`Remove ${x.name||"this shift"} from your schedules? Shifts already logged under it keep their numbers.`)) return;
    d.shifts.splice(+t.dataset.shrm,1); d.crew.forEach(c=>{ if(c.shift===x.id) c.shift=""; }); saveDraft(); render(); return; }
  if (t.dataset.crewrm){ setupDraft().crew.splice(+t.dataset.crewrm,1); saveDraft(); render(); return; }
  switch(t.id){
    case "pSave": savePaste(); break;
    case "cSave": saveDoor(); break;
    case "addName": { const n=$("#newName").value.trim().replace(/\s+/g," "); if(!n){ $("#newName").focus(); break; }
      if (!S().crew.some(c=>c.name.toLowerCase()===n.toLowerCase())){ DB.settings=Object.assign({},DB.settings,{crew:S().crew.concat({name:n,shift:""})}); save(); if(DRAFT.setup) DRAFT.setup.crew.push({name:n,shift:""}); }
      PICK.add(crewList().find(x=>x.toLowerCase()===n.toLowerCase())||n); DRAFT.pick=[...PICK]; delete DRAFT.f.newName; saveDraft(); render(); break; }
    case "nowStart": $("#cStart").value=DRAFT.f.cStart=new Date().toTimeString().slice(0,5); saveDraft(); break;
    case "nowEnd": $("#cEnd").value=DRAFT.f.cEnd=new Date().toTimeString().slice(0,5); saveDraft(); break;
    case "shAdd": { const d=setupDraft(); d.shifts.push({id:uid(), name:"", days:[], start:"", end:"", perDay:false, dayTimes:{}, hours:null}); saveDraft(); render(); const el=$("#shn"+(d.shifts.length-1)); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } break; }
    case "crewAdd": crewAdd(); break;
    case "sSave": saveSetup(); break;
    case "sDiscard": delete DRAFT.setup; saveDraft(); render(); toast("Changes discarded"); break;
    case "bExport": case "clrBackup": exportData(); break;
    case "bCopy": { const s=weekSummary(); (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("Copied"),()=>prompt("Copy this:",s)); break; }
    case "bReset": CLEARING=true; render(); $(".confirm").scrollIntoView({block:"center"}); break;
    case "clrCancel": CLEARING=false; render(); break;
    case "clrGo": clearAll(); break;
    case "themeBtn": { const cur=document.documentElement.dataset.theme, nxt=cur==="dark"?"light":cur==="light"?"":"dark"; if(nxt) document.documentElement.dataset.theme=nxt; else delete document.documentElement.dataset.theme; DB.theme=nxt||null; save(); break; }
  }
});
function onField(e){
  const el=e.target;
  if (DRAFT_FIELDS.includes(el.id)){ DRAFT.f[el.id]=el.value; saveDraft(); if(el.id==="pasteTxt") updatePreview(true); else if(el.id==="pShift"||el.id==="pKind") updatePreview(false); return; }
  if (el.dataset.sf){ setupDraft()[el.dataset.sf]=el.value; saveDraft(); return; }
  if (el.dataset.perday){ const x=setupDraft().shifts[+el.dataset.perday]; x.perDay=el.checked; x.dayTimes=x.dayTimes||{}; saveDraft(); render(); return; }
  if (el.dataset.sh){ const i=+el.dataset.sh, x=setupDraft().shifts[i], k=el.dataset.k;
    if (k.startsWith("dt:")){ const [,d,part]=k.split(":"); x.dayTimes=x.dayTimes||{}; const o=x.dayTimes[d]=Object.assign({start:"",end:""}, x.dayTimes[d]); o[part]=el.value; if(!o.start&&!o.end) delete x.dayTimes[d]; }
    else x[k]=el.value;
    saveDraft(); refreshTotals(i); return; }
  if (el.dataset.crewsh){ setupDraft().crew[+el.dataset.crewsh].shift=el.value; saveDraft(); return; }
  if (el.id==="crewNew"){ DRAFT.crewNew=el.value; saveDraft(); }
}
document.addEventListener("input", onField);
document.addEventListener("change", e=>{
  if (e.target.id==="range"){ OPEN=null; render(); return; }
  if (e.target.id==="bImport" && e.target.files[0]){ importData(e.target.files[0]); return; }
  if (e.target.tagName==="SELECT" || e.target.dataset.perday!=null) onField(e);
});
document.addEventListener("keydown", e=>{
  if (e.key!=="Enter") return;
  if (e.target.id==="crewNew"){ e.preventDefault(); crewAdd(); }
  else if (e.target.id==="newName"){ e.preventDefault(); $("#addName").click(); }
});
let scrollT=0;
window.addEventListener("scroll", ()=>{ clearTimeout(scrollT); scrollT=setTimeout(()=>{ DRAFT.scroll[TAB]=window.scrollY; saveDraft(); },250); }, {passive:true});

/* start: a brand-new browser opens Setup; otherwise every refresh opens the Overview */
if (DB.theme) document.documentElement.dataset.theme = DB.theme;
TAB = isBlank() ? "data" : "dash";
renderRange(); render(); window.scrollTo(0, DRAFT.scroll[TAB]||0);
</script>
</body>
