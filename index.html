<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Shift Board</title>
<style>
:root{
  --bg:#0d0f12; --panel:#14171c; --panel2:#1b1f26; --line:#262b34; --text:#e6e8ec; --muted:#8b93a1;
  --accent:#f0a83a; --on-accent:#141414; --good:#43b883; --bad:#e5645f;
  --s1:#4f9cf7; --s2:#a07cf0; --s3:#f0a83a;
  --r:3px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f3f4f6; --panel:#ffffff; --panel2:#f1f2f4; --line:#dfe2e7; --text:#15181d; --muted:#5c6573; --accent:#c87a0c; --on-accent:#fff; --good:#1e9461; --bad:#c93d3d; --s1:#2d78d6; --s2:#7550cf; --s3:#c87a0c;}
}
:root[data-theme="light"]{--bg:#f3f4f6; --panel:#ffffff; --panel2:#f1f2f4; --line:#dfe2e7; --text:#15181d; --muted:#5c6573; --accent:#c87a0c; --on-accent:#fff; --good:#1e9461; --bad:#c93d3d; --s1:#2d78d6; --s2:#7550cf; --s3:#c87a0c;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;max-width:1100px;margin:0 auto}
.top h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;font-weight:700}
.top h1 b{color:var(--accent);font-weight:700}
.top .sp{flex:1}
nav{display:flex;gap:0;padding:0 8px;max-width:1100px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px 9px;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.02em}
nav button.on{background:none;color:var(--text);border-color:transparent;border-bottom-color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.ghost{background:transparent}
button.sm{padding:4px 9px;font-size:12px}
#range{width:auto;max-width:44vw;min-width:0;padding:5px 8px;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:14px 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.panel>h2{font-size:11px;margin:0;padding:10px 14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.panel>h2 small{text-transform:none;letter-spacing:0;font-weight:400}
.pb{padding:12px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;user-select:none;background:var(--panel2)}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.scroll{overflow-x:auto}
.tag{display:inline-block;border-radius:2px;padding:0 6px;font-size:11px;font-weight:700;line-height:18px;color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:600}
.intro p{margin:0 0 8px}
.intro p:last-child{margin-bottom:0}
.shcard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:4px 12px 12px;margin-top:10px}
.shcard .hd{display:flex;gap:8px;align-items:flex-end}
.shcard .hd>div{flex:1}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{min-width:0;padding:7px 0;font-size:12px;font-weight:600;background:var(--panel)}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tot{font-size:12px;color:var(--muted);margin-top:8px}
.perday{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.dayrow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;margin-top:6px}
.dayrow b{font-size:12px}
.dayrow input{padding:6px 8px}
.dtt{grid-column:2 / 4;font-size:11px;color:var(--muted);margin-top:-2px}
.tot b{color:var(--text)}
.crew{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:var(--r)}
.crew li{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-bottom:1px solid var(--line)}
.crew li:last-child{border-bottom:0}
.crew li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.crew li select{width:auto;max-width:46%;padding:4px 6px;font-size:12px}
.x{background:transparent;border-color:transparent;color:var(--muted);padding:4px 8px}
.x:hover{color:var(--bad);border-color:transparent}
.dirty{font-size:12px;color:var(--accent)}
.confirm{border:1px solid var(--bad);border-radius:var(--r);padding:12px;margin-top:12px}
.confirm p{margin:0 0 8px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text);text-transform:none;letter-spacing:0;margin:8px 0 10px}
.check input{width:auto}
.rank{display:inline-block;min-width:22px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.rank.g{color:var(--accent)}
.detail{background:var(--panel2);border-left:2px solid var(--accent);padding:10px 12px;margin:4px 0 8px;white-space:normal}
.rep{border-left:2px solid var(--line);padding:2px 10px;margin:8px 0}
.rep pre{white-space:pre-wrap;margin:4px 0 0;font:12px/1.4 ui-monospace,Consolas,monospace}
label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{min-height:130px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{border-radius:2px;padding:5px 10px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}
.bar-legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px}
.bar-legend i{display:inline-block;width:8px;height:8px;margin-right:5px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.empty{padding:22px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-size:10px}
@media (max-width:480px){ th,td{padding:7px 8px} .top{padding:10px 12px 6px} main{padding:12px} }
/* ---------- live walk ---------- */
#toast{z-index:40}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.wtop .day{font-weight:700}
.wseg{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:2px}
.wseg button{border:0;background:transparent;padding:6px 14px;font-weight:600;color:var(--muted)}
.wseg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.wstrip{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}
.wstrip::-webkit-scrollbar{display:none}
.wstrip button{flex:0 0 auto;min-width:46px;padding:6px 0;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.wstrip button.cur{border-color:var(--accent);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.wstrip button.s-none{opacity:.45}
.wstrip button.s-full{color:var(--s1)} .wstrip button.s-partial{color:var(--s3)} .wstrip button.s-active{color:var(--good)}
.wstrip button.s-empty{border-style:dashed}
.wstrip i{flex:0 0 1px;background:var(--line);margin:0 4px}
.wmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.wcard{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px 46px;transition:transform .22s ease,opacity .2s;margin:4px auto 12px;max-width:420px}
.wcard.drag{transition:none;cursor:grabbing}
.wcard .lab{color:var(--muted);font-size:13px}
.wcard .num{font-size:clamp(84px,28vw,130px);font-weight:700;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.wcard .st{color:var(--muted);margin-top:10px;min-height:2.6em;text-align:center;max-width:26ch}
.wcard .hint{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.wcard .tg{position:absolute;top:14px;padding:4px 10px;border-radius:999px;font-weight:700;font-size:13px;pointer-events:none}
.wcard .tg.l{right:14px;background:var(--panel2);opacity:var(--pl,0)}
.wcard .tg.r{left:14px;background:var(--accent);color:var(--on-accent);opacity:var(--pr,0)}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:0 auto}
.wbtns button{padding:14px 0;font-size:15px;font-weight:600}
.wsub{display:flex;justify-content:space-between;align-items:center;max-width:420px;margin:8px auto 0;font-size:13px;color:var(--muted)}
.wdoor{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.wdoor:last-child{border-bottom:0}
.wdoor:hover{background:var(--panel2)}
.wdoor .dn{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:22px}
.wdoor.s-done .dn,.wdoor.s-empty .dn{color:var(--muted);font-weight:500}
.wdoor .mn{min-width:0;display:flex;flex-direction:column;gap:7px}
.wdoor .tp{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.k-active{background:var(--good)} .k-partial{background:var(--s3)} .k-full{background:var(--s1)} .k-done{background:var(--muted)} .k-empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.wst{font-weight:600;font-size:13px}
.s-active .wst{color:var(--good)} .s-partial .wst{color:var(--s3)} .s-full .wst{color:var(--s1)} .s-done .wst,.s-empty .wst{color:var(--muted)}
.wtime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wbar{display:flex;align-items:center;gap:8px}
.wbar .tr{flex:1;height:7px;border-radius:4px;background:var(--panel2);overflow:hidden;position:relative}
.wbar .fl{position:absolute;inset:0 auto 0 0;background:#c8a777}
.wbar span{font-size:12px;color:var(--muted);min-width:4.6em;text-align:right;font-variant-numeric:tabular-nums}
.wfacts{font-size:13px;color:var(--muted)}
.wfacts .need{color:var(--accent);font-weight:600}
.wcrew{display:flex;flex-wrap:wrap;gap:4px}
.wchip{border-radius:999px;padding:4px 11px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:500;cursor:pointer}
.wchip.sel,.wchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wslot{border:1px dashed var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--muted)}
body.wsel .wdoor.s-active .wslot,body.wsel .wdoor.s-partial .wslot,body.wsel .wdoor.s-full .wslot{border-color:var(--accent);color:var(--text)}
body.w-hasbench main{padding-bottom:120px}
.wbench{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.wbench .bl{font-size:12px;color:var(--muted);white-space:nowrap}
.wbench .bl b{color:var(--text)}
.wbench .bc{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.wbench .bc::-webkit-scrollbar{display:none}
.wbench .bc .wchip{flex:0 0 auto}
.whint{position:fixed;left:12px;right:12px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--text);color:var(--bg);border-radius:var(--r);padding:8px 10px 8px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.whint button{background:transparent;border:0;color:var(--bg);text-decoration:underline}
#wsheet{position:fixed;inset:0;z-index:20}
#wsheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#wsheet .sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#wsheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#wsheet .hd h3{flex:1;margin:0;font-size:18px}
#wsheet .sec{border-top:1px solid var(--line);padding:10px 0;margin-top:6px}
#wsheet .sec:first-of-type{border-top:0}
.cbar{user-select:none;-webkit-user-select:none}
.cbar .rd{display:flex;justify-content:space-between;align-items:baseline}
.cbar .rd b{font-size:22px}
.cbar .tk{position:relative;height:56px;border-radius:10px 4px 4px 10px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:pointer;margin-top:6px}
.cbar .tk .fl{position:absolute;inset:0 auto 0 0;background-color:#c8a777;background-image:linear-gradient(90deg,rgba(90,60,20,.22) 1px,transparent 1px),linear-gradient(180deg,rgba(90,60,20,.22) 1px,transparent 1px);background-size:14px 14px}
.cbar .tk i{position:absolute;top:10px;bottom:10px;width:1px;background:var(--line)}
.cbar .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.wq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:8px}
.wq button{padding:8px 0;font-weight:600}
.wq button.on,.wsg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.wsg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.wsg button{padding:9px 0;font-weight:600}
.wkv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wkv span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wkv b{font-variant-numeric:tabular-nums}
.wstack{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.wstack button{padding:12px 0;font-weight:600}
.wreport{white-space:pre-wrap;margin:0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.wdone{text-align:center;padding:20px 14px}
.wdone .big{font-size:56px;font-weight:700;line-height:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Shift <b>Board</b></h1>
    <div class="sp"></div>
    <select id="range" aria-label="Week"></select>
    <button class="ghost sm" id="themeBtn" title="Light / dark" aria-label="Light or dark">◐</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div id="toast"></div>

<script>
"use strict";
/* Shift Board — a private shift logger. Everything is stored in this browser only.
   Your own setup and history come from a backup file you load on your device;
   none of it lives in this page. */
const KEY = "shiftboard.v1";
const DKEY = "shiftboard.draft";
const DEFAULT_SETTINGS = { title:"", workerWord:"Workers", supportLabel:"Support", shifts:[], crew:[], source:"" };
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const PALETTE = ["#3d7fd9","#8a63d8","#c27a12","#2e9466","#cf4f6f","#1f97a3","#8f7d22"];

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let DB = Object.assign({settings:{}, base:[], shifts:{}, deleted:[], containers:[], theme:null}, load());
function save(){ _SA = null; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast("Couldn't save on this device"); } }

/* Shift schedules. Older backups stored 1st/2nd/3rd shift hours; those become named shifts. */
function normShifts(st){
  let list = Array.isArray(st.shifts) ? st.shifts : null;
  if (!list){ const h = st.hours || {}; list = Object.keys(h).map(id=>({id, name:id+" shift", hours:+h[id]||null})); }
  return list.filter(x=>x && x.id).map(x=>{
    const dt = {}; for (const [k,v] of Object.entries(x.dayTimes||{})) if (v && (v.start||v.end)) dt[k] = {start:v.start||"", end:v.end||""};
    return {id:String(x.id), name:String(x.name||x.id), days:Array.isArray(x.days)?x.days.map(Number):[], start:x.start||"", end:x.end||"", perDay:!!x.perDay, dayTimes:dt, hours:x.hours!=null&&+x.hours>0?+x.hours:null};
  });
}
function normCrew(c){
  const seen = new Set();
  return (c||[]).map(x=> typeof x==="string" ? {name:x.trim(), shift:""} : {name:String((x&&x.name)||"").trim(), shift:(x&&x.shift)||""})
    .filter(x=>{ const k=x.name.toLowerCase(); if(!x.name||seen.has(k)) return false; seen.add(k); return true; });
}
const S = () => { const raw = DB.settings||{}; const st = Object.assign({}, DEFAULT_SETTINGS, raw); st.shifts = normShifts(raw); st.crew = normCrew(raw.crew); st.title = (st.title||"").trim() || "Shift Board"; return st; };
const isBlank = () => !Object.keys(DB.settings||{}).length && !(DB.base||[]).length && !Object.keys(DB.shifts||{}).length && !(DB.containers||[]).length;

/* Unsaved input, kept across refreshes until it's saved or cleared. */
let DRAFT = (()=>{ try{ return JSON.parse(localStorage.getItem(DKEY)) || {}; }catch(e){ return {}; } })();
DRAFT.f = DRAFT.f || {}; DRAFT.scroll = DRAFT.scroll || {};
function saveDraft(){ try{ localStorage.setItem(DKEY, JSON.stringify(DRAFT)); }catch(e){ /* ignore */ } }

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n,d=1) => n==null||!isFinite(n) ? "–" : (Math.round(n*10**d)/10**d).toLocaleString();
const pd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const weekStart = s => { const d=pd(s); d.setDate(d.getDate()-d.getDay()); return iso(d); };
const dayLbl = s => pd(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const wkLbl = s => { const a=pd(s), b=pd(s); b.setDate(b.getDate()+6); return a.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+b.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
/* every shift: the ones in Setup first, then any shift name found in logged data that isn't in Setup */
let _SA = null;
function shiftsAll(){
  if (_SA) return _SA;
  const list = S().shifts.slice(), ids = new Set(list.map(x=>x.id));
  const add = id => { if(id && !ids.has(id)){ ids.add(id); list.push({id, name:id, days:[], start:"", end:"", hours:null, orphan:true}); } };
  for (const s of allShifts()) add(s.shift);
  for (const c of DB.containers) add(c.shift);
  return (_SA = list);
}
const shiftInfo = id => { const all=shiftsAll(), i=all.findIndex(x=>x.id===id); return i<0 ? {id, name:id||"–", hours:null, color:PALETTE[0], i:99} : Object.assign({}, all[i], {color:PALETTE[i%PALETTE.length], i}); };
const shiftName = id => shiftInfo(id).name;
/* a shift's times on a given weekday: that day's custom hours if set, otherwise the usual hours */
function dayTimes(x, wd){ const o = x && x.perDay && wd!=null && x.dayTimes ? x.dayTimes[wd] : null; return {start:(o&&o.start)||x.start||"", end:(o&&o.end)||x.end||""}; }
function shiftHours(x, wd){ if(!x) return null; const t=dayTimes(x, wd); if(t.start && t.end){ const h=durH(t.start,t.end); return h>0?h:null; } return x.hours||null; }
/* what to show next to a shift name: its usual hours, or "varies" when days differ */
function hoursLabel(x){ const days=x.days&&x.days.length?x.days:[null], hs=[...new Set(days.map(d=>shiftHours(x,d)).filter(Boolean))]; return !hs.length ? "" : hs.length>1 ? "varies" : fmt(hs[0])+"h"; }
const tag = id => { const x=shiftInfo(id); return `<span class="tag" style="background:${x.color}">${esc(x.name)}</span>`; };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2200); }
const uid = () => Math.random().toString(36).slice(2,9);
const mins = t => { if(!t) return null; const [h,m]=t.split(":").map(Number); return h*60+m; };
function durH(a,b){ const x=mins(a), y=mins(b); if(x==null||y==null) return null; let d=y-x; if(d<0) d+=1440; return d/60; }

/* ---------------- data model ---------------- */
function allShifts(){
  const map = {};
  for (const s of DB.base||[]) map[s.id] = JSON.parse(JSON.stringify(s));
  for (const [id,s] of Object.entries(DB.shifts)) map[id] = Object.assign(map[id]||{}, s, {edited:true});
  for (const id of DB.deleted) delete map[id];
  const order = S().shifts.map(x=>x.id), o = id => { const i=order.indexOf(id); return i<0 ? 99 : i; };
  return Object.values(map).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(o(a.shift)-o(b.shift)) || (a.shift<b.shift?-1:1));
}
function metrics(s){
  const e=s.eod||{}, st=s.start||{};
  const workers = e.lumpers ?? st.lumpers ?? null;
  const other = e.lumpersOther ?? st.lumpersOther ?? 0;
  const labor = workers==null ? null : workers + (other||0);
  const completed = e.completed ?? null;
  const hours = shiftHours(shiftInfo(s.shift), pd(s.date).getDay());
  const cons = DB.containers.filter(c=>c.date===s.date && c.shift===s.shift);
  const pieces = cons.reduce((a,c)=>a+(+c.pieces||0),0);
  return {
    workers, other, labor, completed, carried: e.carried ?? null,
    support: e.osEpj ?? st.osEpj ?? null,
    perWorker: labor && completed!=null ? completed/labor : null,
    lhpc: labor && completed && hours ? labor*hours/completed : null, hours,
    pieces: pieces||null, ranked: labor!=null && completed!=null
  };
}
const inRange = d => { const r=$("#range").value; return r==="all" || weekStart(d)===r; };

/* ---------------- report paste parser ---------------- */
function parseReport(text){
  const first = (text.split(/\r?\n/).find(l=>l.trim())||"").toLowerCase();
  const norm = x => String(x).toLowerCase().replace(/\bfirst\b/g,"1st").replace(/\bsecond\b/g,"2nd").replace(/\bthird\b/g,"3rd").replace(/\s+/g," ").trim();
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const fl = norm(first); let shift = null, best = 0;
  for (const sh of S().shifts){
    const n = norm(sh.name), core = n.replace(/ shift$/,"");
    for (const cand of [n, core+" shift", core]) if (cand && cand.length>best && new RegExp("(^|\\W)"+reEsc(cand)+"(\\W|$)").test(fl)){ shift = sh.id; best = cand.length; }
  }
  const kind = /eod|end of day|end of shift/i.test(text) ? "eod" : "start";
  const f = {}; const seen = new Set(); const add=(k,n)=>{ f[k]=(f[k]||0)+n; };
  const W = "(?:lumpers?|workers?|unloaders?|crew|people)";
  const SUP = "(?:os[- ]?epj|support|"+(S().supportLabel||"support").replace(/[^a-z0-9 ]/gi,"").trim().replace(/\s+/g,"[- ]?")+")";
  for (let raw of text.split(/\r?\n|,/)){
    let l = raw.replace(/[⁠‎]/g,"").trim().replace(/^[-•·\s]+/,"").trim();
    const hm = l.match(/^.*?\b(eod|start|report)\b\s*[-–:]\s*(\d.*)$/i); if (hm) l = hm[2];
    const low = l.toLowerCase(); let m;
    if (!l || /^\d{1,2}[\/-]\d{1,2}[\/-]\d{2,4}/.test(l)) continue;
    if ((m=l.match(new RegExp("^(\\d+)\\s*[-–]?\\s*"+W+"\\b(.*)$","i"))) || (m=l.match(new RegExp("^"+W+"\\s+(\\d+)()$","i")))){
      const n=+m[1], rest=m[2].toLowerCase();
      if (/sent home|home early/.test(rest)) add("sentHome",n);
      else if (/(1st|2nd|3rd) shift|from/.test(rest) && (seen.has("w") || /from|3rd shift/.test(rest))) add("lumpersOther",n);
      else if (!seen.has("w")){ f.lumpers=n; seen.add("w"); }
      continue;
    }
    if ((m=l.match(/^(\d+)\s*[-–]?\s*(new |fresh |completed )?(?:containers?|trailers?|loads?)\b(.*)$/i))){
      const n=+m[1], pre=(m[2]||"").toLowerCase(), rest=m[3].toLowerCase();
      if (/yard/.test(rest)) f.yardContainers=n;
      else if (/finish/.test(rest) && /2nd|second|next/.test(rest)) add("carried",n);
      else if (/done|complete|finished/.test(rest) || pre==="completed ") add("completed",n);
      else add("containers",n);
      continue;
    }
    if ((m=l.match(/^(?:containers?|trailers?|loads?)\s+(plugged|completed|done|finish 2nd shift)?\s*(\d+)\s*(completed|done)?$/i))){
      const k=((m[1]||"")+(m[3]||"")).toLowerCase(), n=+m[2];
      if (/finish/.test(k)) add("carried",n); else if (/complet|done/.test(k)) add("completed",n); else add("containers",n);
      continue;
    }
    if ((m=l.match(/^(\d+)\s*(?:with \S+ )?(?:containers? )?finish/i)) && /2nd|second|next/.test(low)){ add("carried",+m[1]); continue; }
    if ((m=l.match(/^(\d+)\s*[-–]?\s*(rollovers?|passovers?|partials?|carryovers?)\b/i))){ add("carried",+m[1]); continue; }
    if (/^(no|0)[ -](rollovers?|passovers?)/.test(low)){ add("carried",0); continue; }
    if ((m=l.match(new RegExp("^(\\d+)\\s*[-–]?\\s*"+SUP+"\\b(.*)$","i"))) || (m=l.match(new RegExp("^"+SUP+"\\s*[-–]?\\s*(\\d+)()\\s*$","i")))){
      if (!/train|call|no show|n\/c|ns\/nc|late|absent|interview|came|arrived|start|from|certified|sick|schedule/i.test(m[2]) && !seen.has("s")){ f.osEpj=+m[1]; seen.add("s"); }
      continue;
    }
    if ((m=low.match(/yard count\s+(\d+)/)) || (m=low.match(/^(\d+)\s+(imports )?yard count/))){ f.yard=+m[1]; continue; }
    if ((m=low.match(/^(\d+)\s*[-–]?\s*shipping/))){ f.shipping=+m[1]; continue; }
  }
  if (kind==="eod" && f.completed==null && f.containers!=null){ f.completed=f.containers; delete f.containers; }
  return {shift, kind, fields:f};
}

function byType(list){
  const out={};
  for (const info of shiftsAll()){
    const sh=info.id;
    const rows=list.filter(s=>s.shift===sh).map(s=>({s,m:metrics(s)})).filter(x=>x.m.ranked);
    const lab=rows.reduce((a,x)=>a+x.m.labor,0), comp=rows.reduce((a,x)=>a+x.m.completed,0), car=rows.reduce((a,x)=>a+(x.m.carried||0),0);
    const timed=rows.filter(x=>x.m.hours), labH=timed.reduce((a,x)=>a+x.m.labor*x.m.hours,0), compT=timed.reduce((a,x)=>a+x.m.completed,0);
    out[sh]={info, hours:hoursLabel(info), missing:rows.length-timed.length, n:rows.length, avgLab:rows.length?lab/rows.length:null, avgComp:rows.length?comp/rows.length:null, perWorker: lab?comp/lab:null, lhpc: compT?labH/compT:null, comp, carried:car};
  }
  return out;
}

function weekChart(){
  const list = allShifts(), weeks=[...new Set(list.map(s=>weekStart(s.date)))].sort(), shs=shiftsAll();
  const data = weeks.map(w=>{ const o={w,tot:0}; for(const x of shs){ o[x.id]=list.filter(s=>weekStart(s.date)===w&&s.shift===x.id).reduce((a,s)=>a+(metrics(s).completed||0),0); o.tot+=o[x.id]; } return o; });
  const max = Math.max(1,...data.map(d=>d.tot));
  const Wd=Math.max(300,weeks.length*64), H=170, bw=30, gap=(Wd-20)/Math.max(1,weeks.length);
  let g=`<line x1="0" x2="${Wd}" y1="${H-22}" y2="${H-22}" stroke="var(--line)"/>`;
  data.forEach((d,i)=>{ let y=H-22; const x=20+i*gap+(gap-bw)/2;
    shs.forEach((sh,j)=>{ const h=d[sh.id]/max*(H-44); if(h>0){ y-=h; g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${PALETTE[j%PALETTE.length]}"><title>${esc(sh.name)}: ${d[sh.id]}</title></rect>`; } });
    g+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" style="fill:var(--text);font-weight:700">${d.tot}</text><text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${pd(d.w).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</text>`;
  });
  const legend = shs.filter(sh=>data.some(d=>d[sh.id])).map(sh=>`<span><i style="background:${shiftInfo(sh.id).color}"></i>${esc(sh.name)}</span>`).join("");
  return `<div class="scroll"><svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}">${g}</svg></div><div class="bar-legend">${legend}<span>Weeks run Sun–Sat</span></div>`;
}

/* ---------- people (from door logs) ---------- */
function workerStats(){
  const P = {};
  for (const c of DB.containers.filter(c=>inRange(c.date))){
    const crew=(c.crew||[]).filter(Boolean); if(!crew.length) continue;
    const share=1/crew.length, h=durH(c.start,c.end), pcs=+c.pieces||0;
    for (const n of crew){
      const p = P[n] ||= {name:n, doors:0, credit:0, pieces:0, hours:0, shifts:new Set()};
      p.doors++; p.credit += c.status==="rolled" ? share*0.5 : share; p.pieces += pcs*share; p.shifts.add(c.date+c.shift);
      if (h!=null) p.hours += h;
    }
  }

function shiftGuess(){
  /* the shift happening now, or the one that ended most recently (within 12 hours), from the schedules in Setup */
  const now=new Date(), list=S().shifts; let best=null;
  for (const back of [0,1]){
    const d=new Date(now.getFullYear(), now.getMonth(), now.getDate()-back);
    for (const sh of list){
      const tm = dayTimes(sh, d.getDay());
      if (!tm.start || !tm.end || (sh.days.length && !sh.days.includes(d.getDay()))) continue;
      const st=new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, mins(tm.start)), en=new Date(st.getTime()+(durH(tm.start,tm.end)||0)*3600000);
      if (st<=now && now<en) return {date:iso(d), shift:sh.id};
      if (en<=now && now-en<12*3600000 && (!best || now-en<best.gap)) best={gap:now-en, date:iso(d), shift:sh.id};
    }
  }
  if (best) return best;
  const today=list.find(sh=>sh.days.includes(now.getDay())) || list[0];
  return {date:iso(now), shift:today?today.id:""};
}

function shiftTotal(x){
  const n = x.days.length, dd = n ? `${n} day${n>1?"s":""} a week` : "";
  if (x.perDay && n){
    const hs = x.days.map(d=>shiftHours(x,d)), known = hs.filter(Boolean), week = known.reduce((a,h)=>a+h,0);
    const same = new Set(known).size===1 && known.length===n;
    if (!known.length) return `${dd} · add times to see the hours`;
    return `${same?`<b>${fmt(known[0],2)} hrs</b> per shift`:"Hours vary by day"} · ${dd} · <b>${fmt(week,2)} hrs</b> a week${known.length<n?` <span class="muted">(${n-known.length} day${n-known.length>1?"s":""} without times)</span>`:""}`;
  }
  const h = x.start && x.end ? durH(x.start,x.end) : null;
  if (h) return `<b>${fmt(h,2)} hrs</b> per shift${n?` · ${dd} · <b>${fmt(h*n,2)} hrs</b> a week`:""}`;
  if (x.hours) return `Counting <b>${fmt(x.hours,2)} hrs</b> per shift until you add start and end times`;

function saveSetup(){
  const d = DRAFT.setup || snapshot();
  const shifts = d.shifts.filter(x=>x.name.trim() || x.days.length || x.start || x.end);
  if (shifts.some(x=>!x.name.trim())){ toast("Give every shift a name"); return; }
  const names = shifts.map(x=>x.name.trim().toLowerCase());
  if (new Set(names).size!==names.length){ toast("Two shifts have the same name"); return; }
  const first = isBlank(), ids = new Set(shifts.map(x=>x.id));
  const st = Object.assign({}, DB.settings, {title:d.title.trim(), workerWord:d.workerWord.trim()||"Workers", supportLabel:d.supportLabel.trim()||"Support",
    shifts: shifts.map(x=>{
      const days=x.days.slice().sort((a,b)=>a-b), dt={};
      if (x.perDay) for (const d of days){ const o=(x.dayTimes||{})[d]; if(o && (o.start||o.end)) dt[d]={start:o.start||"", end:o.end||""}; }
      const anyTimes = (x.start&&x.end) || Object.keys(dt).length;
      return {id:x.id, name:x.name.trim(), days, start:x.start, end:x.end, perDay:!!x.perDay, dayTimes:dt, hours:anyTimes?null:x.hours};
    }),
    crew: d.crew.map(c=>({name:c.name, shift:ids.has(c.shift)?c.shift:""}))});
  delete st.hours;
  DB.settings = st; save(); delete DRAFT.setup; saveDraft(); renderRange();
  if (first){ toast("Setup saved. Log your first shift."); go("log"); } else { toast("Setup saved"); render(); }
}

}
function weekSummary(){
  const w = $("#range").value==="all" ? weekStart(iso(new Date())) : $("#range").value, t=byType(allShifts().filter(s=>weekStart(s.date)===w)), W=S().workerWord.toLowerCase();
  let out=`${S().title} — week of ${wkLbl(w)}\n`;
  for (const v of Object.values(t)) if(v.n) out+=`${v.info.name}: ${v.n} shifts, ${v.comp} containers, ${fmt(v.perWorker,2)} per ${W.replace(/s$/,"")}, ${fmt(v.lhpc)} labor hrs/container\n`;
  return out;
}

/* ---------------- live walk ----------------
   Walk the dock door by door, run the shift from a live board, then save the EOD.
   Finished doors are saved into the same door records the Log page uses (DB.containers),
   and the EOD numbers into the same shift record, so live and after-the-fact logging mix freely. */
const WALK_DOORS = "111-149, 200-249";
const W_MAX = 5;
const W_BOX = {big:"Big", small:"Small", mixed:"Mixed"};
const W_FLOOR = {tight:"Tight", okay:"Okay", open:"Open"};
const W_ST = {active:"Active", partial:"Partial", full:"Full", done:"Done", empty:"Empty trailer"};
const W_LOGST = {done:"Completed", rolled:"Rolled over", pickup:"Finished a rollover"};
let WV = {mode:"walk", sel:null, sheet:null, draft:null, edit:null, confirm:null, start:null, cardIn:false};

const wcfg = () => (DB.walkCfg = DB.walkCfg || {doors:WALK_DOORS});
function wParse(str){
  const out=[], seen=new Set();
  String(str||"").split(/[,;\n]+/).forEach(part=>{
    const m=part.trim().match(/^(\d{1,4})(?:\s*(?:-|–|to)\s*(\d{1,4}))?$/i); if(!m) return;
    let a=+m[1], b=m[2]!=null?+m[2]:a; if(b<a){ const x=a; a=b; b=x; } if(b-a>500) return;
    for(let d=a; d<=b; d++) if(!seen.has(d)){ seen.add(d); out.push(d); }
  });
  return out;
}
const wDoors = () => { const l=wParse(wcfg().doors); return l.length?l:wParse(WALK_DOORS); };
const hhmm = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const wClk = ts => { const d=new Date(ts); const h=d.getHours(); return (h%12||12)+":"+String(d.getMinutes()).padStart(2,"0")+(h<12?"a":"p"); };
const wDur = ms => { const m=Math.max(0,Math.round(ms/60000)), h=Math.floor(m/60); return h?h+"h "+(m%60)+"m":m+"m"; };
const L = () => DB.walk || null;
const wc = d => { const l=L(), r=l&&l.doors[d]; return r?r.c:null; };
const wNew = () => ({left:100, initialLeft:100, empty:false, boxes:null, floor:null, blind:false, pieces:"", skus:"", trailer:"", note:"", workers:[], segs:[], dsegs:[], firstStart:null, doneAt:null, logId:null});
const wWork = c => !!(c && (c.firstStart || c.doneAt || c.workers.length));
const wStarted = c => !!(c.firstStart || c.initialLeft<100 || c.left<100);
function wStatus(c){ if(c.empty) return "empty"; if(c.doneAt) return "done"; if(c.workers.length) return "active"; if(wStarted(c)) return "partial"; return "full"; }
const wLeft = v => v>=100?"Full":v<=0?"Empty":v+"% left";
const wWorked = (c,t) => c.dsegs.reduce((a,s)=>a+((s.e||t||Date.now())-s.s),0);
function wAssign(c,n,t){ if(c.workers.includes(n)) return; if(!c.workers.length){ c.dsegs.push({s:t,e:null}); if(!c.firstStart) c.firstStart=t; } c.workers.push(n); c.segs.push({p:n,s:t,e:null}); }
function wUnassign(c,n,t){
  if(!c || !c.workers.includes(n)) return;
  c.workers=c.workers.filter(x=>x!==n);
  for(let i=c.segs.length-1;i>=0;i--){ const s=c.segs[i]; if(s.p===n && !s.e){ s.e=t; break; } }
  if(!c.workers.length){ const d=c.dsegs[c.dsegs.length-1]; if(d && !d.e) d.e=t; }
}
function wDoorOf(n){ const l=L(); if(!l) return null; for(const k in l.doors){ const c=l.doors[k].c; if(c && c.workers.includes(n)) return +k; } return null; }
function wBench(){ const l=L(); if(!l) return []; const busy=new Set(); Object.values(l.doors).forEach(r=>{ if(r.c) r.c.workers.forEach(n=>busy.add(n)); }); return l.here.filter(n=>!busy.has(n)); }

/* ---- saving into the Log's door records ---- */
function wRecord(door, c, status, endTs){
  const l=L(), share = status==="rolled" ? c.initialLeft-c.left : c.initialLeft;
  const tot = c.pieces===""||c.pieces==null ? null : +c.pieces;
  return {date:l.date, shift:l.shift, door:String(door), trailer:c.trailer||"",
    pieces: tot!=null && share>0 ? String(Math.round(tot*share/100)) : "",
    status, start: c.firstStart?hhmm(c.firstStart):"", end: endTs?hhmm(endTs):"",
    crew:[...new Set(c.segs.map(s=>s.p))], notes:c.note||"", src:"walk"};
}
function wLog(door, c, status, endTs){
  const rec=wRecord(door,c,status,endTs), old=c.logId && DB.containers.find(x=>x.id===c.logId);
  if (old){ const keep = old.edited ? {start:old.start, end:old.end} : {}; Object.assign(old, rec, keep); }
  else { rec.id=uid(); DB.containers.push(rec); c.logId=rec.id; }
}
const wDoneStatus = c => c.initialLeft<100 ? "pickup" : "done";
function wRelog(door){ const c=wc(door); if(c && c.doneAt && c.logId) wLog(door, c, wDoneStatus(c), c.doneAt); }

/* ---- shift start / end ---- */
function wStartShift(){
  const s=WV.start; if(!s.shift){ toast("Add a shift in Setup first"); return; }
  DB.walk={id:uid(), date:s.date, shift:s.shift, startedAt:Date.now(), pos:0, doors:{}, past:[], here:[...s.here], eod:{}};
  WV.mode="walk"; WV.sel=null; WV.start=null; WV.cardIn=true; save(); render(); window.scrollTo(0,0);
  toast("Walk started. Swipe through the doors.");
}
function wEod(){
  const l=L(), cs=Object.values(l.doors).map(r=>r.c).filter(c=>c && !c.empty).concat(l.past||[]);
  const auto={lumpers:l.here.length, completed:cs.filter(c=>c.doneAt).length, carried:cs.filter(c=>!c.doneAt && wStarted(c)).length,
    rollDoors:Object.keys(l.doors).filter(d=>{ const c=l.doors[d].c; return c && !c.empty && !c.doneAt && wStarted(c); })};
  const e=l.eod||{};
  return {auto, lumpers:e.lumpers??auto.lumpers, completed:e.completed??auto.completed, carried:e.carried??auto.carried};
}
function wReport(){
  const l=L(), v=wEod(), ww=S().workerWord, one=ww.replace(/s$/i,""), title=(DB.settings.title||"").trim();
  return [((title?title+" ":"")+shiftName(l.shift)).trim()+" EOD", v.lumpers+" "+(v.lumpers===1?one:ww),
    v.completed+" container"+(v.completed===1?"":"s")+" completed", v.carried+" rollover"+(v.carried===1?"":"s")].join("\n");
}
function wEndShift(){
  const l=L(), t=Date.now(), v=wEod(), text=wReport();
  Object.entries(l.doors).forEach(([d,r])=>{ const c=r.c; if(!c) return; c.workers.slice().forEach(n=>wUnassign(c,n,t)); if(!c.doneAt && !c.empty && c.firstStart) wLog(+d, c, "rolled", t); });
  const id=l.date+"_"+l.shift;
  const s=JSON.parse(JSON.stringify(allShifts().find(x=>x.id===id) || {id, date:l.date, shift:l.shift, start:{}, eod:{}, reports:[]}));
  s.eod=Object.assign({}, s.eod, {lumpers:v.lumpers, completed:v.completed, carried:v.carried});
  s.reports=(s.reports||[]).concat([{who:"Walk", at:new Date().toISOString().slice(0,16), kind:"EOD", text}]);
  delete s.edited; DB.shifts[id]=s; DB.deleted=DB.deleted.filter(x=>x!==id);
  DB.walk=null; WV.confirm=null; WV.sel=null; WV.sheet=null; save(); renderRange(); render(); window.scrollTo(0,0);
  toast("Shift saved. It's on the Shifts page.");
}

/* ---- views ---- */
function viewWalk(){ return L() ? wLiveView() : wStartView(); }

function wLiveView(){

function wStripHTML(doors, pos){
  const l=L(); let h="", prev=null;
  doors.forEach((d,i)=>{
    if(prev!=null && d!==prev+1) h+=`<i></i>`;
    const r=l.doors[d], st=r ? (r.c ? wStatus(r.c) : "none") : "";
    h+=`<button class="${st?"s-"+st:""} ${i===pos?"cur":""}" data-w="jump" data-i="${i}">${d}</button>`; prev=d;
  });
  const walked=doors.filter(d=>l.doors[d]).length, cont=doors.filter(d=>l.doors[d] && l.doors[d].c && !l.doors[d].c.empty).length;
  return `<div class="wmeta"><span>${walked} of ${doors.length} walked</span><span>${cont} container${cont===1?"":"s"} so far</span></div><div class="wstrip" id="wstrip">${h}</div>`;
}
function wDescribe(c){
  if (c.empty) return "Logged as an empty trailer";
  const b=[wLeft(c.left).toLowerCase()]; if(c.boxes) b.push(W_BOX[c.boxes].toLowerCase()+" boxes"); if(c.floor) b.push(W_FLOOR[c.floor].toLowerCase()+" floor"); if(c.blind) b.push("can't see in");
  return "Logged: "+b.join(", ");
}
function wWalkHTML(){
  const l=L(), doors=wDoors(), pos=Math.max(0,Math.min(l.pos|0, doors.length));
  if (pos>=doors.length){
    const recs=doors.map(d=>l.doors[d]), cont=recs.filter(r=>r && r.c && !r.c.empty), full=cont.filter(r=>r.c.initialLeft>=100).length;
    const skipped=doors.filter(d=>!l.doors[d]);
    return wStripHTML(doors,pos)+`<div class="panel"><div class="wdone"><div class="muted">Walk done</div><div class="big">${cont.length}</div><div class="muted">container${cont.length===1?"":"s"} to work: ${full} full, ${cont.length-full} partial</div>
      <div class="row" style="justify-content:center;margin-top:14px">${skipped.length?`<button data-w="jump" data-i="${doors.indexOf(skipped[0])}">Go to skipped door ${skipped[0]}</button>`:""}<button class="pri" data-w="mode" data-m="board">Go to the board</button></div>
      <p class="note">Walk again any time by tapping a door number above.</p></div></div>`;
  }
  const d=doors[pos], r=l.doors[d], st=r ? (r.c ? wDescribe(r.c) : "Logged: nothing at this door") : "Not walked yet";
  const anim=WV.cardIn; WV.cardIn=false;
  return wStripHTML(doors,pos)+`<div class="wcard" id="wcard" style="${anim?"opacity:.4;transform:translateY(8px)":""}" tabindex="0" aria-label="Door ${d}">
      <span class="tg l">Nothing</span><span class="tg r">Trailer</span>
      <div class="lab">Door</div><div class="num">${d}</div><div class="st">${esc(st)}</div>
      <div class="hint"><span>‹ Nothing</span><span>Trailer ›</span></div></div>
    <div class="wbtns"><button data-w="none">Nothing</button><button class="pri" data-w="trailer">Trailer</button></div>
    <div class="wsub"><button class="sm ghost" data-w="back" ${pos===0?"disabled":""}>Back</button><span>Door ${pos+1} of ${doors.length}</span><button class="sm ghost" data-w="skip">Skip</button></div>`;
}
function wTimeText(c,t){
  const st=wStatus(c);
  if (st==="active") return wDur(wWorked(c,t))+" since "+wClk(c.firstStart);
  if (st==="done") return (c.firstStart?wDur(wWorked(c,t))+", ":"")+"done "+wClk(c.doneAt);
  if (c.firstStart) return wDur(wWorked(c,t))+" worked";
  return "";
}
function wChip(n, from){ return `<span class="wchip ${WV.sel===n?"sel":""}" data-w="pick" data-n="${esc(n)}">${esc(n)}</span>`; }
function wRowHTML(d, c){
  const st=wStatus(c), t=Date.now();
  const head=`<div class="tp"><span class="wst"><i class="wdot k-${st}"></i>${W_ST[st]}</span><span class="wtime" data-wt="${d}">${st==="empty"?"Waiting to be pulled":wTimeText(c,t)}</span></div>`;
  if (st==="empty") return `<div class="wdoor s-empty" data-w="door" data-d="${d}"><span class="dn">${d}</span><div class="mn">${head}</div></div>`;
  const load=[c.boxes?W_BOX[c.boxes]+" boxes":"", c.floor?W_FLOOR[c.floor].toLowerCase()+" floor":""].filter(Boolean).join(", ");

  const crew = st==="done" ? `<div class="wfacts">${esc([...new Set(c.segs.map(s=>s.p))].join(", "))}</div>`
    : `<div class="wcrew">${c.workers.map(n=>wChip(n,d)).join("")||`<span class="wslot">${WV.sel?"Tap to put "+esc(WV.sel)+" here":"Tap a name below, then this door"}</span>`}</div>`;
  return `<div class="wdoor s-${st}" data-w="door" data-d="${d}"><span class="dn">${d}</span><div class="mn">${head}
    ${st==="done"?"":`<div class="wbar"><div class="tr"><div class="fl" style="width:${c.left}%"></div></div><span>${wLeft(c.left)}</span></div>`}
    <div class="wfacts">${facts}</div>${c.note?`<div class="wfacts">Note: ${esc(c.note)}</div>`:""}${crew}</div></div>`;
}
function wBoardHTML(){

  </div></div>`;

function wLoggedHTML(date, shift){

        :`<div class="wstack"><button class="pri" data-w="logsave">Save changes</button><button class="sm ghost" data-w="confirm" data-k="logdel">Delete this door</button></div>`}`;
  }
  /* a live door */
  const d=s.door, c=wc(d);
  if (!c) return `<div class="hd"><h3>Door ${d}</h3>${wClose}</div><p class="muted">This door is open now.</p>`;
  const st=wStatus(c), t=Date.now();

  let h=`<div class="hd"><h3>Door ${d}</h3>${wClose}</div><div class="muted"><i class="wdot k-${st}"></i>${sub.join(", ")}</div>`;

  h+=`<div class="sec"><div class="grid2"><div><label>Pieces <span style="text-transform:none">(manifest)</span></label><input data-wf="c:pieces" inputmode="numeric" value="${esc(c.pieces)}"></div>
    <div><label>SKUs</label><input data-wf="c:skus" inputmode="numeric" value="${esc(c.skus)}"></div><div><label>Container #</label><input data-wf="c:trailer" value="${esc(c.trailer)}" placeholder="optional"></div></div></div>`;
  if (!c.doneAt){
    const l2=L();
    h+=`<div class="sec"><label>On this door <span style="text-transform:none">(${c.workers.length} of ${W_MAX}, tap to add or take off)</span></label>
      <div class="wcrew">${l2.here.map(n=>{ const at=wDoorOf(n); return `<span class="wchip ${c.workers.includes(n)?"on":""}" data-w="toggle" data-n="${esc(n)}">${esc(n)}${at!=null&&at!==d?` <small class="muted">${at}</small>`:""}</span>`; }).join("")||`<span class="muted">Nobody is checked in for this walk.</span>`}</div>
      <label>Boxes</label>${wSeg("boxes",W_BOX,c.boxes)}<label>Floor space in front of the door</label>${wSeg("floor",W_FLOOR,c.floor)}
      <label class="check"><input type="checkbox" data-wf="c:blind" ${c.blind?"checked":""}> Can't see all the way in</label></div>`;
  }
  h+=`<div class="sec wkv"><div><span>Started</span><b>${c.firstStart?wClk(c.firstStart):"–"}</b></div><div><span>Worked</span><b>${wDur(wWorked(c,t))}</b></div><div><span>${c.doneAt?"Finished":"Crew"}</span><b>${c.doneAt?wClk(c.doneAt):c.workers.length}</b></div></div>`;
  h+=`<div class="sec"><label>Note</label><input data-wf="c:note" value="${esc(c.note)}" placeholder="Damaged freight, problem truck, why it was left"></div>`;
  if (c.doneAt) h+=`<div class="wstack">${c.logId?`<button class="pri" data-w="editlog" data-id="${esc(c.logId)}">Edit logged times</button>`:""}<button data-w="pulled">Trailer pulled</button><button data-w="reopen">Reopen</button></div>`;
  else h+=`<div class="wstack"><button class="pri" data-w="complete">Mark complete</button>${wRemoveHTML(d)}</div>`;
  return h;
}
const wRemoveHTML = d => WV.confirm==="remove" ? `<div class="confirm"><p>Take door ${d} off the board? Its times and counts are deleted, and its logged door too.</p><div class="row"><button class="danger" data-w="remove">Remove</button><button class="sm ghost" data-w="cancel">Keep it</button></div></div>`

function wRenderSheet(){

}

function wClear(){

function wBindSwipe(card){
  let sx=0, dx=0, on=false, pid=null;
  const set=x=>{ card.style.transform=x?`translateX(${x}px) rotate(${x/26}deg)`:""; card.style.setProperty("--pl",Math.min(1,Math.max(0,-x/110))); card.style.setProperty("--pr",Math.min(1,Math.max(0,x/110))); };
  card.addEventListener("pointerdown",e=>{ if(e.button>0) return; on=true; pid=e.pointerId; sx=e.clientX; dx=0; try{card.setPointerCapture(pid);}catch(_){} card.classList.add("drag"); });
  card.addEventListener("pointermove",e=>{ if(!on||e.pointerId!==pid) return; dx=e.clientX-sx; set(dx); });
  const end=()=>{ if(!on) return; on=false; card.classList.remove("drag"); const th=Math.min(110,card.offsetWidth*.28);
    if (dx>th) wFly(card,1,wTrailer); else if (dx<-th) wFly(card,-1,wNothing); else set(0); };
  card.addEventListener("pointerup",end); card.addEventListener("pointercancel",end);
}
function wFly(card,dir,fn){ card.style.transition="transform .16s ease-in,opacity .16s"; card.style.transform=`translateX(${dir*(innerWidth+80)}px) rotate(${dir*12}deg)`; card.style.opacity="0"; setTimeout(fn,150); }
function wBindBar(tk){
  let on=false, val=+tk.getAttribute("aria-valuenow");
  const pct=x=>{ const r=tk.getBoundingClientRect(); let p=Math.round(((x-r.left)/r.width*100)/5)*5; if(p>97) p=100; if(p<3) p=0; return Math.max(0,Math.min(100,p)); };
  const show=v=>{ tk.querySelector(".fl").style.width=v+"%"; tk.setAttribute("aria-valuenow",v); document.getElementById("wbarv").textContent=wLeft(v); document.getElementById("wbars").textContent=v>0&&v<100?(100-v)+"% done":""; };
  tk.addEventListener("pointerdown",e=>{ on=true; try{tk.setPointerCapture(e.pointerId);}catch(_){} val=pct(e.clientX); show(val); e.preventDefault(); });
  tk.addEventListener("pointermove",e=>{ if(!on) return; const v=pct(e.clientX); if(v!==val){ val=v; show(v); } });
  const end=()=>{ if(!on) return; on=false; wSetBar(val); };
  tk.addEventListener("pointerup",end); tk.addEventListener("pointercancel",end);
}
function wSetBar(v){
  if (WV.sheet && WV.sheet.kind==="slip"){ WV.draft.left=v; wRenderSheet(); return; }
  const c=WV.sheet && wc(WV.sheet.door); if(!c) return;
  c.left=v; if(!wWork(c)) c.initialLeft=v; save(); render();
}

/* ---- walk actions ---- */
const wDoorAt = () => { const l=L(); return l ? wDoors()[l.pos|0] : null; };
function wNothing(){
  const l=L(), d=wDoorAt(); if(d==null) return;
  const c=wc(d);
  if (c && wWork(c) && !c.doneAt){ toast("Door "+d+" has work going. Finish or remove it on the board."); render(); return; }
  if (c && c.doneAt) l.past.push(c);
  l.doors[d]={state:"none", c:null}; l.pos=(l.pos|0)+1; WV.cardIn=true; save(); render();
}
function wTrailer(){
  const d=wDoorAt(); if(d==null) return; const c=wc(d);
  WV.draft = c && !c.doneAt ? {door:d, mode:"walk", left:c.left, boxes:c.boxes, floor:c.floor, blind:c.blind} : {door:d, mode:"walk", left:100, boxes:null, floor:null, blind:false};
  render(); wOpen({kind:"slip"});
}
function wSlipSave(){
  const l=L(), d=WV.draft; if(!d||!l) return;
  let c=wc(d.door);
  if (c && (d.mode==="add" || c.doneAt)){ if(c.doneAt) l.past.push(c); c=null; }
  if (!c) c=wNew();
  const work=wWork(c);
  c.left=d.left; if(!work) c.initialLeft=d.left; c.empty = d.left===0 && !work; c.blind=!!d.blind; c.boxes=d.boxes; c.floor=d.floor;
  l.doors[d.door]={state:"trailer", c};
  if (d.mode==="walk"){ const i=wDoors().indexOf(d.door); l.pos = i>=0 ? i+1 : (l.pos|0)+1; WV.cardIn=true; }
  WV.sheet=null; WV.draft=null; save(); render();
  if (d.mode!=="walk") toast("Door "+d.door+" is on the board");
}
function wMove(n, where){
  const l=L(), t=Date.now(), from=wDoorOf(n);
  WV.sel=null;
  if (where==="bench"){ if(from!=null){ const fc=wc(from); wUnassign(fc,n,t); save(); toast(fc.workers.length?n+" is on the bench":n+" is on the bench. Door "+from+" is partial now."); } render(); return; }
  const d=+where, c=wc(d);
  if (!c || c.doneAt || c.empty){ render(); toast("Door "+d+" isn't open for work"); return; }
  if (from===d){ render(); return; }
  if (c.workers.length>=W_MAX){ render(); toast("Door "+d+" already has "+W_MAX+" people"); return; }
  if (from!=null) wUnassign(wc(from),n,t);
  wAssign(c,n,t); save(); render();
}
function wComplete(d){
  const c=wc(d); if(!c) return; const t=Date.now();
  c.workers.slice().forEach(n=>wUnassign(c,n,t)); c.doneAt=t; c.left=0;
  wLog(d, c, wDoneStatus(c), t); WV.sheet=null; WV.confirm=null; save(); render();
  toast("Door "+d+" done and logged");
}

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-w]"); if(!el || el.disabled) return;
  const a=el.dataset.w, l=L();
  switch(a){
    case "here": { const s=WV.start, n=el.dataset.n; s.here.has(n)?s.here.delete(n):s.here.add(n); render(); break; }
    case "start": wStartShift(); break;
    case "mode": WV.mode=el.dataset.m; WV.sel=null; WV.confirm=null; render(); window.scrollTo(0,0); break;
    case "jump": l.pos=+el.dataset.i; WV.mode="walk"; WV.cardIn=true; save(); render(); break;
    case "none": wNothing(); break;
    case "trailer": wTrailer(); break;
    case "back": l.pos=Math.max(0,(l.pos|0)-1); WV.cardIn=true; save(); render(); break;
    case "skip": l.pos=(l.pos|0)+1; WV.cardIn=true; save(); render(); break;
    case "close": wCloseSheet(); break;
    case "bar": wSetBar(+el.dataset.v); break;

      else { const c=wc(WV.sheet.door); if(c){ c[k]=c[k]===v?null:v; save(); render(); } } break; }
    case "slipsave": wSlipSave(); break;
    case "door": { const d=+el.dataset.d; if(WV.sel){ wMove(WV.sel,d); break; } WV.confirm=null; wOpen({kind:"door", door:d}); break; }
    case "pick": { const n=el.dataset.n; WV.sel = WV.sel===n ? null : n; render(); break; }
    case "bench": if(WV.sel) wMove(WV.sel,"bench"); break;
    case "unsel": WV.sel=null; render(); break;
    case "toggle": { const d=WV.sheet.door, c=wc(d), n=el.dataset.n;
      if (c.workers.includes(n)){ wUnassign(c,n,Date.now()); save(); render(); } else wMove(n,d);
      break; }
    case "complete": wComplete(WV.sheet.door); break;
    case "reopen": { const d=WV.sheet.door, c=wc(d); if(c.logId) DB.containers=DB.containers.filter(x=>x.id!==c.logId); c.logId=null; c.doneAt=null; if(c.left===0) c.left=5; save(); render(); toast("Door "+d+" is open again"); break; }
    case "pulled": { const d=WV.sheet.door, c=wc(d); if(c && c.doneAt) l.past.push(c); l.doors[d]={state:"none", c:null}; WV.sheet=null; save(); render(); toast("Door "+d+" is open"); break; }
    case "hasfreight": { const d=WV.sheet.door, c=wc(d); WV.draft={door:d, mode:"add", left:100, boxes:c&&c.boxes, floor:c&&c.floor, blind:false}; WV.sheet={kind:"slip"}; wRenderSheet(); break; }
    case "remove": { const d=WV.sheet.door, c=wc(d); if(c){ c.workers.slice().forEach(n=>wUnassign(c,n,Date.now())); if(c.logId) DB.containers=DB.containers.filter(x=>x.id!==c.logId); }
      l.doors[d]={state:"none", c:null}; WV.sheet=null; WV.confirm=null; save(); render(); toast("Door "+d+" is off the board"); break; }
    case "confirm": WV.confirm=el.dataset.k; if(WV.sheet) wRenderSheet(); else render(); break;
    case "cancel": WV.confirm=null; if(WV.sheet) wRenderSheet(); else render(); break;
    case "add": wOpen({kind:"add"}); setTimeout(()=>{ const i=document.getElementById("wadd"); if(i) i.focus(); },50); break;
    case "addgo": { const v=parseInt((document.getElementById("wadd")||{}).value,10); if(!v){ toast("Add a door number"); break; }
      const c=wc(v); if(c && !c.doneAt && !c.empty){ toast("Door "+v+" already has a container being worked"); break; }
      WV.draft={door:v, mode:"add", left:100, boxes:null, floor:null, blind:false}; WV.sheet={kind:"slip"}; wRenderSheet(); break; }
    case "editlog": { const r=DB.containers.find(x=>x.id===el.dataset.id); if(!r){ toast("That door isn't logged anymore"); break; }
      WV.edit=Object.assign({}, r, {crew:[...(r.crew||[])]}); WV.confirm=null; WV.sheet={kind:"log", id:r.id}; wRenderSheet(); break; }
    case "ecrew": { const n=el.dataset.n, r=WV.edit; r.crew = r.crew.includes(n) ? r.crew.filter(x=>x!==n) : r.crew.concat(n); el.classList.toggle("on"); break; }
    case "logsave": { const r=DB.containers.find(x=>x.id===WV.sheet.id), d=WV.edit; if(!r){ wCloseSheet(); break; }
      if (!String(d.door||"").trim()){ toast("Add a door number"); break; }
      const timesChanged = d.start!==r.start || d.end!==r.end;
      Object.assign(r, {door:String(d.door).trim(), trailer:(d.trailer||"").trim(), pieces:String(d.pieces||"").replace(/\D/g,""), status:d.status, start:d.start, end:d.end, crew:d.crew, notes:(d.notes||"").trim()});
      if (timesChanged) r.edited=true;
      save(); renderRange(); wCloseSheet(); toast("Door "+r.door+" saved"); break; }
    case "logdel": { const id=WV.sheet.id; DB.containers=DB.containers.filter(x=>x.id!==id);
      if (l) Object.values(l.doors).forEach(rr=>{ if(rr.c && rr.c.logId===id){ rr.c.logId=null; rr.c.doneAt=null; if(rr.c.left===0) rr.c.left=5; } });
      save(); wCloseSheet(); toast("Logged door deleted"); break; }
    case "eodreset": { l.eod[el.dataset.k]=null; delete l.eod[el.dataset.k]; save(); render(); break; }
    case "copy": { const t=wReport(); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Copied. Paste it in the group chat."),()=>{ const p=document.getElementById("wrep"); if(p){ const r=document.createRange(); r.selectNodeContents(p); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Press and hold the report to copy it"); }); break; }
    case "end": wEndShift(); break;
  }
});

    case "bCopy": { const s=weekSummary(); (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("Copied"),()=>prompt("Copy this:",s)); break; }
    case "bReset": CLEARING=true; render(); $(".confirm").scrollIntoView({block:"center"}); break;
    case "clrCancel": CLEARING=false; render(); break;
    case "clrGo": clearAll(); break;
    case "themeBtn": { const cur=document.documentElement.dataset.theme, nxt=cur==="dark"?"light":cur==="light"?"":"dark"; if(nxt) document.documentElement.dataset.theme=nxt; else delete document.documentElement.dataset.theme; DB.theme=nxt||null; save(); break; }
  }
});
function onField(e){
  const el=e.target;
  if (DRAFT_FIELDS.includes(el.id)){ DRAFT.f[el.id]=el.value; saveDraft(); if(el.id==="pasteTxt") updatePreview(true); else if(el.id==="pShift"||el.id==="pKind") updatePreview(false); return; }
  if (el.dataset.sf){ setupDraft()[el.dataset.sf]=el.value; saveDraft(); return; }
  if (el.dataset.perday){ const x=setupDraft().shifts[+el.dataset.perday]; x.perDay=el.checked; x.dayTimes=x.dayTimes||{}; saveDraft(); render(); return; }
  if (el.dataset.sh){ const i=+el.dataset.sh, x=setupDraft().shifts[i], k=el.dataset.k;
    if (k.startsWith("dt:")){ const [,d,part]=k.split(":"); x.dayTimes=x.dayTimes||{}; const o=x.dayTimes[d]=Object.assign({start:"",end:""}, x.dayTimes[d]); o[part]=el.value; if(!o.start&&!o.end) delete x.dayTimes[d]; }
    else x[k]=el.value;
    saveDraft(); refreshTotals(i); return; }
  if (el.dataset.crewsh){ setupDraft().crew[+el.dataset.crewsh].shift=el.value; saveDraft(); return; }
  if (el.id==="crewNew"){ DRAFT.crewNew=el.value; saveDraft(); }
}
document.addEventListener("input", onField);
document.addEventListener("change", e=>{
  if (e.target.id==="range"){ OPEN=null; render(); return; }
  if (e.target.id==="bImport" && e.target.files[0]){ importData(e.target.files[0]); return; }
  if (e.target.tagName==="SELECT" || e.target.dataset.perday!=null) onField(e);
});
document.addEventListener("keydown", e=>{
  if (e.key!=="Enter") return;
  if (e.target.id==="crewNew"){ e.preventDefault(); crewAdd(); }
  else if (e.target.id==="newName"){ e.preventDefault(); $("#addName").click(); }
});
let scrollT=0;
window.addEventListener("scroll", ()=>{ clearTimeout(scrollT); scrollT=setTimeout(()=>{ DRAFT.scroll[TAB]=window.scrollY; saveDraft(); },250); }, {passive:true});

/* start: a brand-new browser opens Setup; otherwise every refresh opens the Overview */
if (DB.theme) document.documentElement.dataset.theme = DB.theme;
TAB = isBlank() ? "data" : "dash";
renderRange(); render(); window.scrollTo(0, DRAFT.scroll[TAB]||0);
</script>
</body>
</html>
